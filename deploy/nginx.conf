# ============================================================
# 智能客服话术库系统 - Nginx 站点配置
# 部署位置: /etc/nginx/sites-available/smart-cs-assist
#
# 说明：
#   1) 默认监听 80；若内地服务器未备案被拦截或与其他服务端口冲突，
#      可把 listen 80; 改成 listen 其他端口;（deploy.sh 会自动替换）
#   2) 若已有已备案域名，可把 server_name _; 改成 server_name 你的域名;
#   3) 修改后执行: nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name _;

    # 上传文件大小上限（Excel 导入，放宽一些）
    client_max_body_size 20m;

    # 前端静态文件（Vite 构建产物）
    root /opt/smart-cs-assist/frontend/dist;
    index index.html;

    # 前端页面与静态资源（SPA 兜底到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 分析、Excel 导入耗时较长，放宽超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
